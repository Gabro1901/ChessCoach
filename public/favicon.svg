<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pieceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with Emerald Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Subtle Internal Radial Glow -->
  <circle cx="32" cy="32" r="22" fill="#10b981" opacity="0.18"/>

  <!-- Centered Chess Knight -->
  <g transform="translate(10, 8) scale(0.98)" filter="url(#glow)">
    <!-- Mane and Body -->
    <path fill="url(#pieceGrad)" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
      d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21z"/>
    <!-- Head & Muzzle -->
    <path fill="url(#pieceGrad)" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
      d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.042-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4.003 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-.994-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.992 2.5-3c1 0 1 3 1 3z"/>
    <!-- Nostril / Muzzle dot -->
    <circle cx="9.5" cy="25.5" r="0.9" fill="#0f172a"/>
    <!-- Eye -->
    <path d="M15 15.75a.6 1.5 30 1 1-1-.5.6 1.5 30 1 1 1 .5" fill="#0f172a"/>
  </g>

  <!-- AI Sparkle / Star (Top Right) -->
  <path d="M49 8l1.5 4.5L55 14l-4.5 1.5L49 20l-1.5-4.5L43 14l4.5-1.5z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="49" cy="14" r="1.2" fill="#fff"/>
</svg>
